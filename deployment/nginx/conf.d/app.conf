server {
    listen 80;
    server_name localhost;

    # Frontend Proxy
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Proxy
    location /api {
        # If backend serves PHP via FPM, we might need FastCGI if proxied directly, 
        # but usually backend exposes HTTP if using 'php artisan serve' OR we use nginx in backend container.
        # But here we are proxying to backend service. 
        # Backend runs PHP-FPM on port 9000 (external service deployment).
        # Nginx communicates directly with FastCGI for API requests.
        
        try_files $uri $uri/ /index.php?$query_string;
        location ~ \.php$ {
           root /var/www/public; # Must match backend path
           fastcgi_pass app:9000;
           fastcgi_index index.php;
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
           fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
    
    # Wait, if I use try_files, I need root.
    root /var/www/public; # But this volume is not mounted here in Nginx container!!!
    
    # NOTE: For external service deployment, ensure backend code is accessible
    # or use simplified config forwarding all /api requests to index.php
}
