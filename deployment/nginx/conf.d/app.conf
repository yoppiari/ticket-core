server {
    listen 80;
    server_name localhost;

    # Frontend Proxy
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Proxy
    location /api {
        # If backend serves PHP via FPM, we might need FastCGI if proxied directly, 
        # but usually backend exposes HTTP if using 'php artisan serve' OR we use nginx in backend container.
        # But here we are proxying to backend service. 
        # In docker-compose, backend runs 'php-fpm' which is FastCGI (port 9000).
        # Nginx cannot proxy_pass HTTP to FastCGI port.
        # So we need a FastCGI block OR run a webserver in backend container.
        
        # Option A: Run Nginx in backend container too?
        # Option B: Configure THIS nginx to talk FastCGI to backend:9000.
        
        # Let's use FastCGI for /api.
        
        # Remove /api prefix? Laravel routes usually expect /api.
        # If we request /api/users, we want to hit standard Laravel processing.
        # But Laravel index.php handles requests.
        
        # Simplest: Proxy to a webserver in backend.
        # But my backend Dockerfile only runs php-fpm.
        
        # So I MUST configure FastCGI here.
        
        try_files $uri $uri/ /index.php?$query_string;
        location ~ \.php$ {
           root /var/www/public; # Must match backend path
           fastcgi_pass app:9000;
           fastcgi_index index.php;
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
           fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
    
    # Wait, if I use try_files, I need root.
    root /var/www/public; # But this volume is not mounted here in Nginx container!!!
    
    # ISSUE: Nginx container needs access to Backend code to serve static files or pass to FastCGI?
    # Actually for API, we just need to pass to FastCGI.
    # But Nginx checks for file existence with try_files.
    
    # Correction:
    # 1. Update docker-compose to mount backend code to nginx too.
    # 2. Or simplified config: forward everything /api to index.php
}
